import groovy.json.JsonSlurper

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.moxbots.mobile'
version = '0.1.0'

// Resolve the Java verifier belonging to the locked Rust dependency, never a
// separately downloaded TLS verifier or a permissive certificate manager.
def connectionManifest = new File(projectDir, '../../../../connection/Cargo.toml').canonicalPath
def metadataText = providers.exec {
  commandLine 'cargo', 'metadata', '--locked', '--format-version', '1', '--filter-platform',
    'aarch64-linux-android', '--manifest-path', connectionManifest
}.standardOutput.asText.get()
def metadata = new JsonSlurper().parseText(metadataText)
def verifiers = metadata.packages.findAll { it.name == 'rustls-platform-verifier-android' }
if (verifiers.size() != 1) {
  throw new GradleException('Android TLS verifier must have one locked Java/Rust version; align Cargo.lock before building')
}
def verifier = verifiers.first()
def verifierMaven = new File(new File(verifier.manifest_path).parentFile, 'maven')
repositories {
  maven { url = verifierMaven.toURI(); metadataSources { artifact() } }
}

android {
  namespace 'com.moxbots.mobile.remote'
  defaultConfig {
    minSdk 24
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    ndk { abiFilters 'arm64-v8a' }
    externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror' } }
    consumerProguardFiles 'consumer-rules.pro'
  }
  externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
  // CMake links the Rust connection as DT_NEEDED but does not copy imported
  // shared objects into this AAR. Package it in both the app APK and the
  // library's independent instrumentation APK.
  sourceSets {
    main { jniLibs.srcDirs = ['native'] }
    androidTest { jniLibs.srcDirs = ['native'] }
  }
}

dependencies {
  // Version follows the crate's own embedded Maven directory, covered by Cargo.lock.
  implementation "rustls:rustls-platform-verifier:${verifier.version}"

  // AndroidX Test stable releases (Google Maven): emulator-backed native validation.
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:core:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

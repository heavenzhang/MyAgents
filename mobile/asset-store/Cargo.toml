[package]
name = "moxbots-asset-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "AGPL-3.0-only"
[dependencies]
myagents-host-management-protocol = { path = "../../src-tauri/host-management-protocol" }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
fs2 = "0.4"
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile = "3"

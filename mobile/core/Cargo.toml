[package]
name = "moxbots-mobile-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "AGPL-3.0-only"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
myagents-agent-network-crypto = { package = "moxbots-mobile-crypto", path = "../crypto", features = ["native-store"] }
myagents-agent-network-protocol = { path = "../../src-tauri/agent-network-protocol" }
myagents-host-management-protocol = { path = "../../src-tauri/host-management-protocol" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
url = "2"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["sync", "rt"] }

[dev-dependencies]
myagents-agent-network-crypto = { package = "moxbots-mobile-crypto", path = "../crypto", features = ["native-store", "test-support"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
futures-util = "0.3"
tempfile = "3"

[package]
name = "myagents-host-management-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dev-dependencies]
jsonschema = { version = "=0.58.3", default-features = false }
